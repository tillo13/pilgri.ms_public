# Google App Engine Configuration for Galactica Character Creation Game
runtime: python312
instance_class: F1

entrypoint: gunicorn -b :$PORT -w 1 --threads 4 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 50 app:app

automatic_scaling:
  min_instances: 0
  max_instances: 2

env_variables:
  GCP_PROJECT_ID: "galactica-character-game"
  GAE_ENV: "standard"
  FLASK_ENV: "production"
  
  # gRPC/ALTS Warning Suppression
  GRPC_VERBOSITY: "ERROR"
  GRPC_TRACE: ""
  GLOG_minloglevel: "2"

# CRITICAL: Cross-project Cloud SQL configuration
beta_settings:
  cloud_sql_instances: "kumori-404602:us-central1:kumori"

handlers:
  - url: /static
    static_dir: static
    secure: always
    expiration: "1d"
  - url: /favicon\.ico
    static_files: static/favicon.ico
    upload: static/favicon\.ico
    secure: always
    expiration: "7d"
  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301